[package]
name = "graph-notes-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
env_logger = "0.11"
once_cell = "1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
chrono = {version = "0.4", features = ["serde"]}
thiserror = "2.0.18"
anyhow = "1.0"
sqlx = { version = "0.8.6", features = ["sqlite", "chrono", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

[dev-dependencies]
rstest = "0.26.1"